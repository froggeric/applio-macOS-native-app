name: CI (macOS build)

# Manual build-only smoke test (no cert, no notarization): start it from the
# Actions tab to check that the app still builds on a clean machine. Pushes and
# pull requests do NOT start it. macOS runners bill at about ten times Linux,
# are metered even on public repos, and on 2026-11-26 two runs ended without a
# runner at all. Ad-hoc signed (local-use quality), NOT distributable.
# Releases are built locally: README_MACOS.md "Release checklist", docs/ROADMAP.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv_macos
        uses: actions/cache@v4
        with:
          path: venv_macos
          key: venvmacos-${{ runner.os }}-py312-${{ hashFiles('requirements_macos.txt') }}
          restore-keys: venvmacos-${{ runner.os }}-py312-

      - name: Create venv + install dependencies
        run: |
          if [ ! -x venv_macos/bin/python ]; then
            python3.12 -m venv venv_macos
          fi
          venv_macos/bin/pip install --upgrade pip wheel
          venv_macos/bin/pip install -r requirements_macos.txt

      - name: Build (ad-hoc, no signing)
        run: venv_macos/bin/python build_macos.py

      - name: Assert Apple-valid bundle version
        run: |
          set -e
          CFV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/Applio.app/Contents/Info.plist)
          CFSLV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Applio.app/Contents/Info.plist)
          echo "CFBundleVersion=$CFV  CFBundleShortVersionString=$CFSLV"
          # CFBundleVersion must be 1-3 numeric segments (notarization requires it).
          echo "$CFV" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "ERROR: CFBundleVersion not Apple-valid: $CFV"; exit 1; }

      - name: Verify ad-hoc signature
        run: codesign --verify --all-architectures --deep --strict --verbose=2 dist/Applio.app
